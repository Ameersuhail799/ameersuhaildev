  <!-- Synchronous Anti-Flash Theme Intensity Initializer (Default: 0% / Dark) -->
  <script>
    (function() {
      try {
        var intensity = 0;
        var savedIntensity = localStorage.getItem('themeIntensity');
        if (savedIntensity !== null) {
          var num = Number(savedIntensity);
          if (!isNaN(num) && num >= 0 && num <= 100) intensity = num;
        } else {
          var legacyTheme = localStorage.getItem('theme');
          if (legacyTheme === 'light') intensity = 100;
        }
        var root = document.documentElement;
        var normalized = (intensity / 100).toFixed(4);
        var darkProgress = Math.min(1, intensity / 50).toFixed(4);
        var lightProgress = Math.max(0, (intensity - 50) / 50).toFixed(4);

        root.style.setProperty('--theme-intensity', normalized);
        root.style.setProperty('--dark-progress', darkProgress);
        root.style.setProperty('--light-progress', lightProgress);
        root.setAttribute('data-theme-intensity', Math.round(intensity).toString());
        var isLight = intensity >= 50;
        if (isLight) {
          root.classList.add('light');
          root.classList.remove('dark');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }
      } catch (e) {
        document.documentElement.style.setProperty('--theme-intensity', '0');
        document.documentElement.style.setProperty('--dark-progress', '0');
        document.documentElement.style.setProperty('--light-progress', '0');
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
